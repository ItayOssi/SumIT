# Builds SumIT for macOS (Apple Silicon) on a GitHub Mac and publishes the release.
# Push a tag v<version>-mac whose version matches macos/package.json, or run it by hand on a branch: then the tag
# v<version>-mac is created on that commit. The notes come from docs/release-<version>.md.
name: Release macOS

on:
  push:
    tags: ['v*-mac']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check the tag matches the version
        run: |
          VERSION=$(node -p "require('./macos/package.json').version")
          TAG="v$VERSION-mac"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then echo "Tag $GITHUB_REF_NAME does not match version $VERSION"; exit 1; fi
          test -f "docs/release-$VERSION.md" || { echo "docs/release-$VERSION.md is missing"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install
        working-directory: macos
        run: npm ci

      # Without CI: the sign-in test checks that the app answers the CLI's prompt, as on a student's Mac.
      - name: Checks and offline tests
        working-directory: macos
        run: env -u CI npm test

      # Signed ad-hoc ("identity": "-" in package.json): unsigned, macOS calls a downloaded copy "damaged".
      - name: Build DMG and ZIP
        working-directory: macos
        run: |
          bash scripts/make-icns.sh
          npx electron-builder --mac --arm64 --publish never
          ls -lh dist

      - name: Check the signature
        working-directory: macos
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/SumIT.app
          codesign -dv dist/mac-arm64/SumIT.app 2>&1 | tee sign.txt
          grep -q "Signature=adhoc" sign.txt
          # The zip that the automatic update installs must carry the same signature.
          rm -rf ziptest && mkdir ziptest && ditto -x -k "dist/SumIT-$VERSION-arm64.zip" ziptest
          codesign --verify --deep --strict --verbose=2 ziptest/SumIT.app

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat "docs/release-$VERSION.md"
            echo
            echo "### התקנה (Apple Silicon / M1-M4)"
            echo "1. הורידו את \`SumIT-$VERSION-arm64.dmg\`, פתחו אותו וגררו את **SumIT.app** לתיקיית \`Applications\`."
            echo "2. פתחו את SumIT. בפעם הראשונה macOS יגיד שאי אפשר לאמת את המפתח, כי האפליקציה לא רשומה אצל Apple. לחצו \"סיום\", פתחו את **הגדרות המערכת ← פרטיות ואבטחה**, גללו למטה ולחצו **\"פתח בכל זאת\"** ליד SumIT."
            echo "3. אם זה לא עובד, אפשר להריץ פעם אחת ב-Terminal:"
            echo '   ```bash'
            echo '   xattr -cr /Applications/SumIT.app'
            echo '   ```'
            echo "4. מגרסה 1.0.25 והלאה האפליקציה מתעדכנת לבד: כשיוצאת גרסה חדשה מופיע \"הורד והתקן בסגירה\"."
          } > notes.md
          gh release create "$TAG" \
            "macos/dist/SumIT-$VERSION-arm64.dmg" "macos/dist/SumIT-$VERSION-arm64.zip" \
            --repo "$GITHUB_REPOSITORY" --title "SumIT $VERSION ל-macOS (Apple Silicon)" --notes-file notes.md --target "$GITHUB_SHA"
