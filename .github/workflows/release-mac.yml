# Builds SumIT for macOS (Apple Silicon) on a GitHub Mac and publishes the release.
# Push a tag v<version>-mac whose version matches macos/package.json, or run it by hand on a branch: then the tag
# v<version>-mac is created on that commit. The notes come from docs/release-<version>.md.
name: Release macOS

on:
  push:
    tags: ['v*-mac']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check the tag matches the version
        run: |
          VERSION=$(node -p "require('./macos/package.json').version")
          TAG="v$VERSION-mac"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then echo "Tag $GITHUB_REF_NAME does not match version $VERSION"; exit 1; fi
          test -f "docs/release-$VERSION.md" || { echo "docs/release-$VERSION.md is missing"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install
        working-directory: macos
        run: npm ci

      - name: Checks and offline tests
        working-directory: macos
        run: npm test

      - name: Build DMG and ZIP
        working-directory: macos
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          bash scripts/make-icns.sh
          npx electron-builder --mac --arm64 --publish never
          ls -lh dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat "docs/release-$VERSION.md"
            echo
            echo "### התקנה (Apple Silicon / M1-M4)"
            echo "1. הורידו את \`SumIT-$VERSION-arm64.dmg\`, פתחו אותו וגררו את **SumIT.app** לתיקיית \`Applications\`."
            echo "2. הגרסה לא חתומה אצל Apple, ולכן לפני ההפעלה הראשונה הריצו פעם אחת ב-Terminal:"
            echo '   ```bash'
            echo '   xattr -cr /Applications/SumIT.app'
            echo '   ```'
            echo "3. מגרסה 1.0.25 והלאה האפליקציה מתעדכנת לבד: כשיוצאת גרסה חדשה מופיע \"הורד והתקן בסגירה\"."
          } > notes.md
          gh release create "$TAG" \
            "macos/dist/SumIT-$VERSION-arm64.dmg" "macos/dist/SumIT-$VERSION-arm64.zip" \
            --repo "$GITHUB_REPOSITORY" --title "SumIT $VERSION ל-macOS (Apple Silicon)" --notes-file notes.md --target "$GITHUB_SHA"
